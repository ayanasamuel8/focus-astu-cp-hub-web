name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    name: Build & Deploy MkDocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          pip install \
            mkdocs-material \
            mkdocs-glightbox

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Create GitHub deployment
        uses: bobheadxi/deployments@v1
        id: create-deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: github-pages

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --message "docs: deploy from ${{ github.sha }}"

      - name: Update GitHub deployment status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.create-deployment.outputs.env }}
          deployment_id: ${{ steps.create-deployment.outputs.deployment_id }}
          env_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Summary
        if: success()
        run: |
          echo "### Documentation deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
