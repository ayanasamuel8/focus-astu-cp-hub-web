name: Bug Report
description: Something is broken — not sure which component, or it spans multiple components
title: "[Bug] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please fill out the form below.
        For component-specific bugs use the **Frontend Bug**, **Backend Bug**, or **Extension Bug** templates instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the app is affected?
      multiple: true
      options:
        - Frontend (web portal)
        - Backend (API)
        - Extension
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did. Be as specific as possible.
      placeholder: |
        1. Log in as ...
        2. Navigate to ...
        3. Click ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop images here — very helpful for UI bugs.

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "e.g. Chrome 124 on Windows 11"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Your account role at the time
      options:
        - Community
        - Squad Member
        - Squad Lead
        - Admin
        - Not logged in
        - Not sure
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console errors (if any)
      description: Open DevTools → Console and copy any red errors here.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help?
