name: Package & Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish to Chrome Web Store?
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Zip, attach to release, and publish to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          cd extension
          zip -r ../focus-astu-cp-hub-extension.zip . \
            --exclude "*.DS_Store" \
            --exclude "*Thumbs.db"

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: focus-astu-cp-hub-extension.zip

      - name: Upload as artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: focus-astu-cp-hub-extension
          path: focus-astu-cp-hub-extension.zip
          retention-days: 7

      # ── Chrome Web Store publish ──────────────────────────────────────────
      # Runs on every release, OR on manual dispatch with publish=true.
      # Requires 4 repository secrets (see docs/extension/installation.md):
      #   CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
      #   CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
      - name: Publish to Chrome Web Store
        if: |
          (github.event_name == 'release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: focus-astu-cp-hub-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
