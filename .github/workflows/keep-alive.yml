name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "event=${{ github.event_name }} utc=$(date -u)"
          set +e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            https://focus-astu-cp-hub-web.onrender.com/api/healthz)
          echo "Health check status: $STATUS"
          exit 0
