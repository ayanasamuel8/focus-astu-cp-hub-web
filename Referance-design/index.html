<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus ASTU CP Hub — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* base — cool near-black */
    --bg:        #0a0c10;
    --surface:   #11141a;
    --surface-2: #161a21;
    --surface-3: #1d222b;
    --hover:     #222834;
    --border:    #272d39;
    --border-soft:#1c212a;
    --text:      #e9ebf0;
    --text-2:    #99a0ad;
    --text-3:    #626a78;

    /* signature accent — focus teal */
    --accent:    #25d6c1;
    --accent-2:  #14b3a2;
    --accent-3:  #0e8579;
    --accent-text:#63e6d6;
    --accent-ghost: rgba(37,214,193,0.13);
    --accent-line:  rgba(37,214,193,0.30);

    /* semantic */
    --gain:   #45d483;
    --loss:   #f2654f;
    --streak: #ff9646;
    --streak-2:#ff6a35;
    --warn:   #f3b53c;
    --warn-ghost: rgba(243,181,60,0.14);
    --danger: #f2654f;

    /* platforms */
    --lc:    #ffa116;
    --cf:    #5790ff;
    --ac:    #a78bfa;
    --other: #8c94a3;

    --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 20px;
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body:    "IBM Plex Sans", system-ui, sans-serif;
    --font-mono:    "JetBrains Mono", ui-monospace, monospace;
    --font-serif:   "Spectral", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: #f0eee9; }

  /* shared helpers used inside artboards */
  .fa-app { font-family: var(--font-body); color: var(--text); background: var(--bg); }
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .disp { font-family: var(--font-display); }
  .num  { font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-line); color: #fff; }

  /* scrollbars inside frames stay invisible (canvas hides them anyway) */
  .fa-app *::-webkit-scrollbar { width: 8px; height: 8px; }
  .fa-app *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  @keyframes fa-pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(243,181,60,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(243,181,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(243,181,60,0); }
  }
  @keyframes fa-flame {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50%     { transform: scale(1.08) rotate(2deg); }
  }
  @keyframes fa-blink { 50% { opacity: 0; } }
  .fa-caret { display:inline-block; width:7px; height:1.05em; background:var(--accent); margin-left:2px; vertical-align:-2px; animation: fa-blink 1.1s steps(1) infinite; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="lib/ui.jsx"></script>
  <script type="text/babel" src="lib/code.jsx"></script>
  <script type="text/babel" src="screens/foundations.jsx"></script>
  <script type="text/babel" src="screens/landing.jsx"></script>
  <script type="text/babel" src="screens/auth.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/problems.jsx"></script>
  <script type="text/babel" src="screens/submission.jsx"></script>
  <script type="text/babel" src="screens/editorial.jsx"></script>
  <script type="text/babel" src="screens/contests.jsx"></script>
  <script type="text/babel" src="screens/profile.jsx"></script>
  <script type="text/babel" src="screens/squad.jsx"></script>
  <script type="text/babel" src="screens/announcements.jsx"></script>
  <script type="text/babel" src="screens/admin.jsx"></script>
  <script type="text/babel" src="screens/settings.jsx"></script>
  <script type="text/babel" src="screens/appshell.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
