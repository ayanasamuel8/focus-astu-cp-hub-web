name: Package & Publish Extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish to Chrome Web Store?
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Zip, attach to release, and publish to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On push to main, generate a monotonically-increasing version so Chrome
      # accepts the upload (version must always be higher than the last).
      # Format: 1.0.<workflow_run_number>  e.g. 1.0.12
      # On a release or manual dispatch, use whatever is in manifest.json.
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="1.0.${{ github.run_number }}"
            jq --arg v "$VERSION" '.version = $v' extension/manifest.json \
              > /tmp/manifest.json
            mv /tmp/manifest.json extension/manifest.json
            echo "Bumped manifest version to $VERSION"
          else
            VERSION=$(jq -r '.version' extension/manifest.json)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          cd extension
          zip -r ../focus-astu-cp-hub-extension.zip . \
            --exclude "*.DS_Store" \
            --exclude "*Thumbs.db"

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: focus-astu-cp-hub-extension.zip

      - name: Upload as artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: focus-astu-cp-hub-extension-${{ env.VERSION }}
          path: focus-astu-cp-hub-extension.zip
          retention-days: 30

      # ── Chrome Web Store publish ──────────────────────────────────────────
      # Runs on every push to main that touches extension/, every published
      # release, or a manual dispatch with publish=true.
      # Required repository secrets:
      #   CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
      #   CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
      - name: Publish to Chrome Web Store
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: focus-astu-cp-hub-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
