name: Package & Publish Extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish to Chrome Web Store?
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Zip, attach to release, and publish to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On push to main, generate a monotonically-increasing version so Chrome
      # accepts the upload (version must always be higher than the last).
      # Format: 1.0.<workflow_run_number>  e.g. 1.0.12
      # On a release or manual dispatch, use whatever is in manifest.json.
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="1.0.${{ github.run_number }}"
            jq --arg v "$VERSION" '.version = $v' extension/manifest.json \
              > /tmp/manifest.json
            mv /tmp/manifest.json extension/manifest.json
            echo "Bumped manifest version to $VERSION"
          else
            VERSION=$(jq -r '.version' extension/manifest.json)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          cd extension
          zip -r ../focus-astu-cp-hub-extension.zip . \
            --exclude "*.DS_Store" \
            --exclude "*Thumbs.db"

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: focus-astu-cp-hub-extension.zip

      - name: Upload as artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: focus-astu-cp-hub-extension-${{ env.VERSION }}
          path: focus-astu-cp-hub-extension.zip
          retention-days: 30

      # ── Chrome Web Store publish ──────────────────────────────────────────
      # Uses direct curl calls instead of a third-party action for transparency.
      # Required repository secrets:
      #   CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
      #   CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
      - name: Publish to Chrome Web Store
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          # Strip any accidental whitespace/newlines from the secret
          EXTENSION_ID=$(echo -n "$EXTENSION_ID" | tr -d '[:space:]')
          echo "Extension ID length: ${#EXTENSION_ID} (expected 32)"
          echo "Extension ID last 4 chars: ${EXTENSION_ID: -4}"

          # 1. Get access token
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token \
            | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            exit 1
          fi
          echo "Access token obtained"

          # 2. Upload new version
          UPLOAD_RESPONSE=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @focus-astu-cp-hub-extension.zip)

          echo "Upload response: $UPLOAD_RESPONSE"

          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState')
          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "Upload failed with state: $UPLOAD_STATE"
            exit 1
          fi
          echo "Upload successful"

          # 3. Publish
          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")

          echo "Publish response: $PUBLISH_RESPONSE"

          STATUS=$(echo "$PUBLISH_RESPONSE" | jq -r '.status[]' 2>/dev/null || echo "$PUBLISH_RESPONSE" | jq -r '.status' 2>/dev/null)
          echo "Publish status: $STATUS"
